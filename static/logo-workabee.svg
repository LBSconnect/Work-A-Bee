<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Work-A-Beez logo">
  <!-- Honeycomb hexagon badge, matching the hex-icon motif used throughout the site -->
  <polygon points="32,2 60,18 60,46 32,62 4,46 4,18" fill="#FFC107" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Wings: flat angular shapes suggesting motion / a checkmark, echoing "time tracking" -->
  <polygon points="30,27 14,18 15,34 30,34" fill="#ffffff" fill-opacity="0.92"/>
  <polygon points="34,27 50,18 49,34 34,34" fill="#ffffff" fill-opacity="0.92"/>

  <!-- Body: bold geometric capsule with two stripes -->
  <rect x="21" y="27" width="22" height="26" rx="11" fill="#1a1a1a"/>
  <rect x="21" y="35" width="22" height="4.5" fill="#FF6F00"/>
  <rect x="21" y="43" width="22" height="4.5" fill="#FFC107"/>

  <!-- Stinger -->
  <polygon points="32,53 28,58 36,58" fill="#1a1a1a"/>

  <!-- Head -->
  <circle cx="32" cy="20" r="8.5" fill="#1a1a1a"/>

  <!-- Antennae -->
  <path d="M27 14 Q24 7 19 5" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="19" cy="5" r="1.8" fill="#1a1a1a"/>
  <path d="M37 14 Q40 7 45 5" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="45" cy="5" r="1.8" fill="#1a1a1a"/>

  <!-- Eyes -->
  <circle cx="28.5" cy="21" r="2.6" fill="#ffffff"/>
  <circle cx="28.5" cy="21" r="1.2" fill="#1a1a1a"/>
  <circle cx="35.5" cy="21" r="2.6" fill="#ffffff"/>
  <circle cx="35.5" cy="21" r="1.2" fill="#1a1a1a"/>
</svg>
