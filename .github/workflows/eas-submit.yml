name: EAS Submit (mobile)

# Submits the most recent successfully-finished iOS build to the App Store,
# without triggering a new build - for when a build is already sitting in
# EAS (e.g. from a manual `eas build` or a prior run of the "EAS Build"
# workflow without auto_submit). Manual dispatch only, same reasoning as EAS
# Build: this hands the app straight to Apple's review queue, so it should
# never fire automatically.
#
# Needs the same secrets as EAS Build's auto_submit path - see that
# workflow's header comment for exactly where to generate each one:
#   EXPO_TOKEN            - authenticates the eas-cli itself
#   APPLE_ASC_KEY_ID       ) from an App Store Connect API Key
#   APPLE_ASC_ISSUER_ID    ) (App Store Connect -> Users and Access ->
#   APPLE_ASC_API_KEY      )  Integrations -> Keys)
on:
  workflow_dispatch: {}

concurrency:
  group: eas-submit-ios
  cancel-in-progress: false

jobs:
  submit:
    name: eas submit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up eas-cli
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo authentication
        run: eas whoami

      - name: Wire up App Store Connect API key
        env:
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_API_KEY: ${{ secrets.APPLE_ASC_API_KEY }}
        run: |
          if [ -z "$APPLE_ASC_KEY_ID" ] || [ -z "$APPLE_ASC_ISSUER_ID" ] || [ -z "$APPLE_ASC_API_KEY" ]; then
            echo "::error::Missing APPLE_ASC_KEY_ID / APPLE_ASC_ISSUER_ID / APPLE_ASC_API_KEY repository secrets - see the comment at the top of this workflow file."
            exit 1
          fi
          printf '%s' "$APPLE_ASC_API_KEY" > AuthKey.p8
          jq --arg keyId "$APPLE_ASC_KEY_ID" --arg issuerId "$APPLE_ASC_ISSUER_ID" \
            '.submit.production.ios.ascApiKeyPath = "./AuthKey.p8" | .submit.production.ios.ascApiKeyId = $keyId | .submit.production.ios.ascApiKeyIssuerId = $issuerId' \
            eas.json > eas.json.tmp
          mv eas.json.tmp eas.json

      - name: EAS Submit (latest finished iOS build)
        run: eas submit --platform ios --profile production --non-interactive --latest
