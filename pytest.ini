[pytest]
testpaths = tests
python_files = test_*.py
# Without this, `pytest tests/` (the bare console script, as opposed to
# `python -m pytest`) doesn't add the repo root to sys.path, so top-level
# modules like `orgs`/`app`/`models` fail to import - only `python -m
# pytest` masks this locally by adding the CWD itself. Confirmed as the
# actual cause of the first real CI run's failure (2026-08).
pythonpath = .
